<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Thanks for your RSVP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2933;
        background: #f9fafb;
      }

      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        background: #ffffff;
        max-width: 480px;
        width: 100%;
        padding: 32px 24px;
        border-radius: 24px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
        text-align: center;
      }

      h1 {
        font-size: 1.8rem;
        margin: 0 0 10px;
      }

      p {
        margin: 0 0 16px;
        color: #4b5563;
        font-size: 0.95rem;
      }

      .pill {
        display: inline-block;
        margin-top: 10px;
        padding: 10px 18px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        background: linear-gradient(135deg, #0ea5e9, #6366f1);
        color: white;
      }

      .details {
        margin-top: 18px;
        font-size: 0.9rem;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Thanks for your RSVP 💌</h1>
      <p>We've received your details and can't wait to see you at the baby shower.</p>
      <p>Add it to your calendar so you don't forget:</p>

      <a href="/baby-shower.ics" class="pill" download>
        Add to calendar
      </a>

      <div class="details">
        <p>Monday 1 December, 11:00am – 2:00pm</p>
        <p>Eddy Gardens, Melbourne</p>
      </div>
    </main>
  </body>
</html>
