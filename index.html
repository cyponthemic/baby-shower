<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cloud-cabin.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parent Picnic - RSVP</title>
    <!-- Meta tags are injected by vite-plugin-meta from constants.ts -->
  </head>
  <body>
    <!-- Hidden form for Netlify form detection -->
    <form name="baby-shower-rsvp" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" aria-label="Name" />
      <input type="email" name="email" aria-label="Email" />
      <textarea name="food_requirements" aria-label="Food requirements"></textarea>
      <input type="text" name="can_attend" aria-label="Can attend" />
      <input type="text" name="guests" aria-label="Guests" />
      <input type="text" name="guest_count" aria-label="Guest count" />
    </form>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
